<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النيل فون | نظام تصنيف رسائل الزبائن</title>
<style>
  :root { --bg:#f6f8f7; --card:#fff; --text:#16231d; --muted:#5d6b64; --brand:#0b7a4b; --line:#dfe6e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1713; --card:#17211c; --text:#e8f0ec; --muted:#9bb0a5; --brand:#34c27f; --line:#2a3a32; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--brand); color:#fff; text-align:center; padding:22px 16px; }
  header h1 { margin:0; font-size:26px; }
  header p { margin:6px 0 0; opacity:.9; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:18px 14px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  label { display:block; font-weight:600; margin-bottom:8px; }
  textarea { width:100%; min-height:120px; padding:12px; font:inherit; font-size:16px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; resize:vertical; }
  button { width:100%; margin-top:12px; padding:13px; font:inherit; font-size:17px; font-weight:700; color:#fff; background:var(--brand); border:0; border-radius:10px; }
  button:disabled { opacity:.6; }
  .samples { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .samples span { font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); cursor:pointer; }
  #result { margin-top:16px; display:none; }
  .badge { display:inline-block; font-size:22px; font-weight:800; padding:6px 16px; border-radius:10px; }
  .b-pos { background:#d9f5e6; color:#0b6b3f; } .b-neg { background:#fde0de; color:#a3261c; } .b-cmp { background:#fff0cc; color:#8a5a00; }
  .conf { margin:10px 0 14px; color:var(--muted); }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:14px; }
  .row .n { width:56px; } .row .bar { flex:1; height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
  .row .bar i { display:block; height:100%; background:var(--brand); width:0; transition:width .4s; }
  .row .p { width:44px; text-align:left; color:var(--muted); }
  #err { color:#c0392b; margin-top:10px; display:none; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<header>
  <h1>النيل فون</h1>
  <p>نظام افتراضي لتصنيف رسائل الزبائن: إيجابي / سلبي / شكوى</p>
</header>
<main>
  <div class="card">
    <label for="msg">رسالة الزبون</label>
    <textarea id="msg" placeholder="اكتب رسالة الزبون هنا..."></textarea>
    <div class="samples" id="samples"></div>
    <button id="go">توقّع</button>
    <div id="err"></div>
    <div id="result">
      <span class="badge" id="label"></span>
      <div class="conf" id="conf"></div>
      <div id="bars"></div>
    </div>
  </div>
  <footer>TF-IDF + Multinomial Naive Bayes — يعمل على Cloudflare Pages Functions</footer>
</main>
<script>
const samples = [
  "الشبكة ممتازة والنت سريع",
  "خدمتكم سيئة جداً",
  "خصموا مني رصيد ما استخدمته وعايز أرجّعه",
  "يا سلام على الشبكة، كل ساعة بتقطع"
];
const cls = { "إيجابي":"b-pos", "سلبي":"b-neg", "شكوى":"b-cmp" };
const $ = (id) => document.getElementById(id);
samples.forEach(s => { const e = document.createElement("span"); e.textContent = s; e.onclick = () => { $("msg").value = s; }; $("samples").appendChild(e); });

$("go").onclick = async () => {
  const text = $("msg").value.trim();
  $("err").style.display = "none";
  if (!text) { $("err").textContent = "اكتب رسالة أولاً"; $("err").style.display = "block"; return; }
  $("go").disabled = true;
  try {
    const r = await fetch("/predict", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "خطأ");
    $("label").textContent = d.label;
    $("label").className = "badge " + (cls[d.label] || "");
    $("conf").textContent = "نسبة الثقة: " + (d.confidence * 100).toFixed(1) + "%";
    $("bars").innerHTML = "";
    Object.entries(d.scores).sort((a,b) => b[1]-a[1]).forEach(([k,v]) => {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = '<span class="n"></span><span class="bar"><i></i></span><span class="p"></span>';
      row.querySelector(".n").textContent = k;
      row.querySelector(".p").textContent = (v*100).toFixed(0) + "%";
      $("bars").appendChild(row);
      requestAnimationFrame(() => { row.querySelector("i").style.width = (v*100) + "%"; });
    });
    $("result").style.display = "block";
  } catch (e) { $("err").textContent = e.message; $("err").style.display = "block"; }
  $("go").disabled = false;
};
</script>
</body>
</html>
